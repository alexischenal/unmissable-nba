# Every morning: fetch last night's games, compute the ratings, commit the public JSON
# and redeploy the site to GitHub Pages. Also redeploys on every push to main.

name: Daily update and deploy

on:
  schedule:
    # Cron times are UTC. Every 30 minutes from 05:00 to 09:30 UTC
    # = 06:00 to 10:30 in Paris in winter (07:00 to 11:30 in summer).
    # The night is published by the first run after its last game ends;
    # later runs see it's already there and stop right away.
    - cron: "*/30 5-9 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: "US date to fetch (YYYY-MM-DD). Empty = last night."
        required: false

permissions:
  contents: write # commit the new JSON
  pages: write    # deploy to GitHub Pages
  id-token: write # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch last night's games
        if: github.event_name != 'push'
        env:
          DATE: ${{ github.event.inputs.date }}
        run: |
          set +e
          if [ -n "$DATE" ]; then ARGS="--date=$DATE"; else ARGS=""; fi
          node --experimental-strip-types --no-warnings scripts/fetch-night.ts $ARGS
          code=$?
          if [ $code -eq 2 ]; then
            echo "::notice::Some games aren't over yet. Keeping the previous data; the next run will retry."
            exit 0
          fi
          exit $code

      - name: Commit new data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "data: night of $(jq -r .date public/data/latest.json)"
            # Someone may have pushed to main during the run: replay our commit on top of it.
            git pull --rebase
            git push
          fi

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
