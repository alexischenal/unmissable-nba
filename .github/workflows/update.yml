# Started every 5 minutes by cron-job.org (GitHub's own schedule, hourly, is only a fallback):
# puts a night on the site at its first tip-off, rates each game
# as soon as it's over, then rebuilds and redeploys the site. Also redeploys on every push to main.
#
# Most runs have nothing to do (no game under way, night already fully rated): the script
# says so in a few seconds and nothing is built or deployed. See scripts/nba/plan.ts.

name: Update and deploy

on:
  schedule:
    # Fallback only: once an hour (minute 7, away from GitHub's busy :00), never between 08:00 and
    # 15:00 UTC, when no game can need a run (checked on the 2026-27 schedule: npm run check-window).
    # Cron times are UTC. cron-job.org follows the same window.
    - cron: "7 0-7,15-23 * * *"
  push:
    branches: [main]
  # Also started every 5 minutes by cron-job.org through the GitHub API (more punctual than
  # GitHub's own schedule, which stays as a fallback). See BACKLOG.md.
  workflow_dispatch:
    inputs:
      date:
        description: "US date to fetch (YYYY-MM-DD). Empty = whatever the current time calls for."
        required: false

permissions:
  contents: write # commit the new JSON
  pages: write    # deploy to GitHub Pages
  id-token: write # required by deploy-pages

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # One data run at a time, so two runs never publish the same night.
    concurrency:
      group: data
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      # The script only uses Node's built-ins: no npm install needed, so idle runs stay short.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The schedule is downloaded once per night, then kept here between runs (a few KB, see
      # scripts/nba/schedule-cache.ts). A night starts at 06:00 New York time, like in plan.ts.
      - name: Night key
        id: night
        run: echo "night=$(TZ=America/New_York date -d '-6 hours' +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore the night's schedule
        id: schedule
        uses: actions/cache/restore@v5
        with:
          path: .cache/schedule.json
          key: schedule-${{ steps.night.outputs.night }}

      - name: Fetch the night's games
        env:
          DATE: ${{ github.event.inputs.date }}
          # The real settings of the algorithm (Settings → Secrets and variables → Actions)
          SCORING_CONFIG: ${{ secrets.SCORING_CONFIG }}
        run: |
          if [ -n "$DATE" ]; then ARGS="--date=$DATE"; else ARGS=""; fi
          node --experimental-strip-types --no-warnings scripts/fetch-night.ts $ARGS

      # Only after the first run of a night (no copy for that night yet), and only if the script
      # succeeded: the copy it wrote is then the fresh one.
      - name: Keep the night's schedule
        if: steps.schedule.outputs.cache-hit != 'true' && hashFiles('.cache/schedule.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .cache/schedule.json
          key: schedule-${{ steps.night.outputs.night }}

      - name: Commit new data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No new data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: night of $(jq -r .date public/data/latest.json)"
            # Someone may have pushed to main during the run: replay our commit on top of it.
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    # On a push, "update" is skipped: deploy anyway. Otherwise (schedule, cron-job.org, the
    # Run workflow button), only deploy when there is new data — cron-job.org starts a run
    # every 5 minutes, it must not redeploy the site each time.
    if: >-
      always() && (
        github.event_name == 'push' ||
        needs.update.outputs.changed == 'true'
      ) && needs.update.result != 'failure'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The branch tip, so the data just committed by "update" is included.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
