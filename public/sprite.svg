<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Unmissable's icons. Use one in a component with:
      <svg className="…" aria-hidden="true"><use href="/sprite.svg#dots" /></svg>
    Each icon takes the color of its text (currentColor). Its size comes from the CSS of the outer <svg>.
  -->
  <style>
    /* "In progress..." — one dot, then two, then three, then it starts again.
       Each dot has its own keyframes: it appears at its quarter of the cycle and stays until the end. */
    .dot { opacity: 0; animation: 2s linear infinite; }
    .dot:nth-child(1) { animation-name: dot1; }
    .dot:nth-child(2) { animation-name: dot2; }
    .dot:nth-child(3) { animation-name: dot3; }
    @keyframes dot1 { 0%, 24.9% { opacity: 0; } 25%, 100% { opacity: 1; } }
    @keyframes dot2 { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes dot3 { 0%, 74.9% { opacity: 0; } 75%, 100% { opacity: 1; } }
    /* Visitors who turned motion off: the three dots just stay */
    @media (prefers-reduced-motion: reduce) {
      .dot { opacity: 1; animation: none; }
    }
  </style>

  <!-- Three dots, animated: after "In progress" -->
  <symbol id="dots" viewBox="0 0 30 6" fill="currentColor">
    <circle class="dot" cx="3" cy="3" r="3" />
    <circle class="dot" cx="15" cy="3" r="3" />
    <circle class="dot" cx="27" cy="3" r="3" />
  </symbol>
</svg>
